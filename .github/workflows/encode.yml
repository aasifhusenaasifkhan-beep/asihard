name: Video Processing Pipeline
run-name: "${{ inputs.task_type }} | ${{ inputs.rename }}"

on:
  workflow_dispatch:
    inputs:
      task_type:
        description: 'Task Type'
        required: true
      video_id:
        description: 'Telegram Video Link'
        required: true
      sub_id:
        description: 'Subtitle Link'
        required: false
        default: 'none'
      rename:
        description: 'Output File Name'
        required: false
        default: 'output.mp4'
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      user_id:
        description: 'User ID'
        required: false
        default: 'none'
      resolution:
        description: 'Resolution'
        required: false
        default: 'none'
      font_link:
        description: 'Font Link'
        required: false
        default: 'none'
      trigger_msg_id:
        description: 'Trigger Message ID'
        required: false
        default: 'none'

permissions:
  contents: read

jobs:
  encode_job:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # pip and apt run at the same time -> shorter start-up.
      # fonts-* : Arial-compatible + Devanagari/Noto fallbacks, so subtitles never turn into boxes.
      - name: Install FFmpeg, fonts & Python deps
        run: |
          pip install -r requirements.txt &
          PIP_PID=$!
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ffmpeg fontconfig fonts-liberation fonts-dejavu-core fonts-noto-core
          wait $PIP_PID

      - name: Run Studio Processor
        env:
          PYTHONUNBUFFERED: '1'
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STRING_SESSION: ${{ secrets.STRING_SESSION }}
          TASK_TYPE: ${{ github.event.inputs.task_type }}
          VIDEO_ID: ${{ github.event.inputs.video_id }}
          SUB_ID: ${{ github.event.inputs.sub_id }}
          RENAME: ${{ github.event.inputs.rename }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          USER_ID: ${{ github.event.inputs.user_id }}
          RESOLUTION: ${{ github.event.inputs.resolution }}
          FONT_LINK: ${{ github.event.inputs.font_link }}
          TRIGGER_MSG_ID: ${{ github.event.inputs.trigger_msg_id }}
        run: python studio.py
